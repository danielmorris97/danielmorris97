<body class="contact-body">

            aria-current="page">

        </a>

    </nav>

</header>


<main
    id="main-content"
    class="contact-page">

    <section class="contact-intro">

        <h1>
            Contact Me
        </h1>

        <p class="contact-tagline">
            Have a question, research idea, or potential collaboration?
            Feel free to shoot me an email!
        </p>

        <p class="contact-email">

            <a href="mailto:danielmorris2027@u.northwestern.edu">
                danielmorris2027@u.northwestern.edu
            </a>

        </p>

    </section>


    <section class="contact-form-section">

        <h2 class="contact-form-heading">
            Send me a <em>message</em>
        </h2>

        <form
            class="contact-form"
            action="https://formspree.io/f/xvkpdbyy"
            method="POST">

            <input
                type="hidden"
                name="subject"
                value="New message from danieljacobmorris.com">


            <fieldset class="name-fieldset">

                <legend>
                    Name
                </legend>

                <div class="form-row">

                    <div class="form-field">

                        <label for="first-name">

                            First Name

                            <span class="required-text">
                                required
                            </span>

                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            autocomplete="given-name"
                            required>

                    </div>


                    <div class="form-field">

                        <label for="last-name">

                            Last Name

                            <span class="required-text">
                                required
                            </span>

                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            autocomplete="family-name"
                            required>

                    </div>

                </div>

            </fieldset>


            <div class="form-field">

                <label for="email">

                    Email

                    <span class="required-text">
                        required
                    </span>

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-field">

                <label for="message">

                    Message

                    <span class="required-text">
                        required
                    </span>

                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required>
                </textarea>

            </div>


            <button
                class="form-submit"
                type="submit">

                SEND MESSAGE

            </button>

        </form>

    </section>

</main>
