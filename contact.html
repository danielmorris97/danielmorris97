<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact | Daniel Jacob Morris</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="contact-body">

<a
    class="skip-link"
    href="#main-content">
    Skip to main content
</a>


<header class="site-header contact-header">

    <a
        class="site-name contact-site-name"
        href="index.html">
        Daniel Jacob Morris
    </a>

    <nav
        class="contact-nav"
        aria-label="Main navigation">

        <a href="index.html">
            About
        </a>

        <a href="research.html">
            Research
        </a>

        <a href="publications.html">
            Publications
        </a>

        <a href="media.html">
            Media
        </a>

        <a href="cv.html">
            CV
        </a>

        <a
            href="contact.html"
            aria-current="page">
            Contact
        </a>

    </nav>

</header>


<main
    id="main-content"
    class="contact-page">


    <section class="contact-intro">

        <h1>Contact Me</h1>

        <p>
            Feel free to send me an email!
        </p>

        <p class="contact-email">
            <a href="mailto:danielmorris2027@u.northwestern.edu">
                danielmorris2027@u.northwestern.edu
            </a>
        </p>

    </section>


    <section class="contact-form-section">

        <form
            class="contact-form"
            action="https://formspree.io/f/xvkpdbyy"
            method="POST">

            <input
                type="hidden"
                name="subject"
                value="New message from danieljacobmorris.com">


            <fieldset class="name-fieldset">

                <legend>Name</legend>

                <div class="form-row">

                    <div class="form-field">

                        <label for="first-name">
                            First Name
                            <span class="required-text">(required)</span>
                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            autocomplete="given-name"
                            required>

                    </div>


                    <div class="form-field">

                        <label for="last-name">
                            Last Name
                            <span class="required-text">(required)</span>
                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            autocomplete="family-name"
                            required>

                    </div>

                </div>

            </fieldset>


            <div class="form-field">

                <label for="email">
                    Email
                    <span class="required-text">(required)</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-field">

                <label for="message">
                    Message
                    <span class="required-text">(required)</span>
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required></textarea>

            </div>


            <button
                class="form-submit"
                type="submit">
                SEND
            </button>

        </form>

    </section>

</main>


<footer class="contact-footer">

    <p>
        © Daniel Jacob Morris
    </p>

</footer>


</body>
</html>
