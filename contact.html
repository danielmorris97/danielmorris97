<body>

    href="#main-content">

</a>


<header class="site-header">

    <a
        class="site-name"
        href="index.html">
        Daniel Jacob Morris

    <nav aria-label="Main navigation">

        <a href="index.html">

        <a href="research.html">

        <a href="publications.html">

        <a href="cv.html">

        <a
            href="contact.html"
            aria-current="page">
            Contact
        </a>

    </nav>

</header>


<main
    id="main-content"
    class="contact-page">


    <section class="contact-intro">

        <h1>Contact</h1>

        <p>
            For research, collaboration, or other inquiries,
            feel free to get in touch.
        </p>

        <p class="contact-email">
            <a href="mailto:danielmorris2027@u.northwestern.edu">
                danielmorris2027@u.northwestern.edu
            </a>
        </p>

    </section>


    <section class="contact-form-section">

        <h2>Send a message</h2>


        <form
            class="contact-form"
            action="https://formspree.io/f/xvkpdbyy"
            method="POST">


            <input
                type="hidden"
                name="subject"
                value="New message from danieljacobmorris.com">


            <div class="form-row">

                <div class="form-field">

                    <label for="first-name">
                        First name
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="firstName"
                        autocomplete="given-name"
                        required>

                </div>


                <div class="form-field">

                    <label for="last-name">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="last-name"
                        name="lastName"
                        autocomplete="family-name"
                        required>

                </div>

            </div>


            <div class="form-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-field">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required></textarea>

            </div>


            <button
                class="form-submit"
                type="submit">

                Send message

            </button>

        </form>

    </section>


</main>


<footer>

    <p>
        © Daniel Jacob Morris
    </p>

</footer>


</body>

</html>
